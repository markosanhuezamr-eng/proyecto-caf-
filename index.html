e ser constante, como miel cayendo.","Detén la extracción cuando el café comience a salir rubio claro. Debe haber una crema dorada de 3-4mm."],tips:["Usa café recién tostado de 7-21 días para mejor sabor.","La crema debe ser color avellana con manchas 'tigre'.","Si sale muy rápido, muele más fino. Si sale lento, más grueso.","El agua debe estar entre 90-96°C para una extracción óptima."]},{name:"Cappuccino",description:"Equilibrio perfecto de espresso, leche y espuma. Un clásico italiano.",imageUrl:"https://images.unsplash.com/photo-1687902625864-faedb40f83a8?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxjYXBwdWNjaW5vJTIwbGF0dGUlMjBhcnQlMjBtaW5pbWFsaXN0JTIwd2hpdGUlMjBiYWNrZ3JvdW5kfGVufDF8fHx8MTc3MjA0NzkyOXww&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",prepTime:"3-4 minutos",steps:["Prepara un espresso doble (40-50ml) siguiendo la técnica tradicional en una taza de 150-180ml precalentada.","Vierte 120ml de leche fría (4-7°C) en una jarra de acero inoxidable hasta llenar 1/3 del recipiente.","Purga la varilla de vapor para eliminar agua condensada.","Sumerge la punta de la varilla justo bajo la superficie de la leche en un ángulo de 15 grados.","Abre el vapor completamente. Escucharás un sonido de 'papel rasgándose' mientras incorporas aire durante 5-7 segundos.","Baja la jarra ligeramente para sumergir más la varilla y crear un vórtex. Continúa vaporizando hasta alcanzar 60-65°C.","Cierra el vapor y retira la jarra. La leche debe tener una textura de pintura brillante, sin burbujas grandes.","Golpea suavemente la jarra contra el mostrador y gira para eliminar burbujas. La espuma debe ser microespuma sedosa.","Vierte la leche sobre el espresso desde una altura de 3-4cm, comenzando en el centro.","Cuando la taza esté 2/3 llena, baja la jarra y acelera el vertido para crear el arte latte."],tips:["La proporción ideal es 1/3 espresso, 1/3 leche, 1/3 espuma.","La leche debe estar fría antes de vaporizar.","La textura debe ser brillante y sin burbujas visibles.","La temperatura perfecta es 60-65°C, nunca exceder 70°C."]},{name:"Latte Macchiato",description:"Capas elegantes de leche manchada con café. Suave y visualmente atractivo.",imageUrl:"https://images.unsplash.com/photo-1604298458655-ae6e04213678?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxsYXR0ZSUyMG1hY2NoaWF0byUyMGxheWVyZWQlMjBnbGFzcyUyMG1pbmltYWxpc3R8ZW58MXx8fHwxNzcyMDQ3OTI5fDA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",prepTime:"4-5 minutos",steps:["Vaporiza 200ml de leche siguiendo la técnica de microespuma hasta alcanzar 60-65°C.","Vierte la leche vaporizada en un vaso de vidrio alto (300ml) llenándolo completamente.","Deja reposar la leche durante 30-60 segundos para que se separen las capas naturalmente.","Prepara un espresso simple o doble (30-40ml) en un recipiente aparte.","Con una cuchara, sostén ligeramente la espuma de la superficie.","Vierte lentamente el espresso en el centro del vaso desde una altura de 10cm.","El café debe atravesar la espuma y asentarse en la leche creando 3 capas distintivas.","La capa inferior será leche, la media café, y la superior espuma manchada."],tips:["Usar vaso transparente para apreciar las capas.","Verter el espresso lentamente para mejores capas.","La temperatura de la leche afecta la separación de capas.","Dejar reposar es clave para la estratificación perfecta."]},{name:"Americano",description:"Espresso alargado con agua caliente. Suave pero con el carácter del espresso.",imageUrl:"https://images.unsplash.com/photo-1658418467495-134ce7d69430?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxhbWVyaWNhbm8lMjBjb2ZmZWUlMjBibGFjayUyMGN1cCUyMG1pbmltYWxpc3R8ZW58MXx8fHwxNzcyMDQ3OTI5fDA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",prepTime:"2-3 minutos",steps:["Calienta agua fresca filtrada hasta alcanzar 85-90°C. No debe hervir para evitar sabor amargo.","Precalienta una taza grande de 240-350ml con agua caliente.","Prepara un espresso doble (40-50ml) directamente en la taza precalentada.","Vierte suavemente 150-200ml de agua caliente sobre el espresso en movimiento circular.","Para preservar la crema, algunos baristas vierten primero el agua y luego el espresso encima.","La proporción recomendada es 1:2 (espresso:agua) pero ajusta según preferencia.","Remueve suavemente si deseas una mezcla uniforme."],tips:["Usa agua filtrada para mejor sabor.","No uses agua hirviendo, quema el café.","Ajusta la cantidad de agua según tu gusto.","Algunos prefieren 'Long Black': agua primero, espresso después."]},{name:"Mocha",description:"Deliciosa fusión de café, chocolate y leche. Un postre hecho bebida.",imageUrl:"https://images.unsplash.com/photo-1630445035074-2b3d21673229?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxtb2NoYSUyMGNvZmZlZSUyMGNob2NvbGF0ZSUyMG1pbmltYWxpc3R8ZW58MXx8fHwxNzcyMDQ3OTI5fDA&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",prepTime:"4-5 minutos",steps:["Agrega 2 cucharadas (30ml) de jarabe de chocolate o 15g de cacao en polvo a una taza grande precalentada.","Si usas cacao en polvo, mezcla con un poco de agua caliente hasta crear una pasta suave sin grumos.","Prepara un espresso doble (40-50ml) y viértelo sobre el chocolate.","Remueve vigorosamente con una cuchara hasta que el chocolate esté completamente disuelto.","Vaporiza 180ml de leche hasta alcanzar 65°C con microespuma cremosa.","Vierte la leche sobre la mezcla de café y chocolate, creando capas.","Agrega crema batida en la parte superior formando una cúpula generosa.","Decora con cacao en polvo, chocolate rallado o jarabe de chocolate en la crema."],tips:["Usa chocolate de buena calidad para mejor sabor.","Puedes usar chocolate blanco para una variante.","Ajusta la cantidad de chocolate según tu gusto.","La crema batida es opcional pero tradicional."]},{name:"Flat White",description:"Microespuma sedosa con espresso doble intenso. Origen australiano/neozelandés.",imageUrl:"https://images.unsplash.com/photo-1719840195557-b87e064766e4?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxmbGF0JTIwd2hpdGUlMjBjb2ZmZWUlMjBsYXR0ZSUyMGFydCUyMGNlcmFtaWMlMjBjdXAlMjBtaW5pbWFsaXN0fGVufDF8fHx8MTc3MjA0NzkyOXww&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",prepTime:"3-4 minutos",steps:["Prepara un espresso doble ristretto (30-35ml) en una taza de 150-180ml. Debe ser más concentrado que un espresso normal.","Vierte 100ml de leche entera fría en una jarra de metal pequeña.","Vaporiza la leche creando microespuma muy fina. La textura debe ser como pintura de seda líquida.","Calienta la leche hasta 60-62°C, más baja que un latte. Esto crea una textura más sedosa.","Golpea la jarra y gira para integrar completamente la espuma con la leche.","Vierte la leche desde cerca del espresso (2-3cm) con movimiento constante.","La microespuma debe ser tan fina que apenas se note la capa de espuma, solo 2-3mm.","Termina con arte latte si deseas, la textura perfecta lo permite."],tips:["La clave es la microespuma ultra fina, sin burbujas.","Usa taza más pequeña que un latte para mantener sabor fuerte.","El ristretto aporta intensidad sin amargor.","Menos espuma que cappuccino, más cremosidad."]},{name:"Cortado",description:"Espresso 'cortado' con leche, perfectamente equilibrado 1:1.",imageUrl:"https://images.unsplash.com/photo-1630659508320-b1627db88a9c?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxjb3J0YWRvJTIwZ2xhc3MlMjBjb2ZmZWUlMjBtaW5pbWFsaXN0fGVufDF8fHx8MTc3MjA0NzkyOXww&ixlib=rb-4.1.0&q=80&w=1080&utm_source=figma&utm_medium=referral",prepTime:"2-3 minutos",steps:["Calienta un vaso pequeño de vidrio de 120-150ml o una tacita de cerámica.","Prepara un espresso doble (40ml) directamente en el vaso.","Vaporiza 40ml de leche entera. La proporción debe ser 1:1 con el espresso.","Calienta la leche solo hasta 55-60°C para mantenerla dulce y no quemar.","Crea u
